[package]
name = "safe-rs-cli"
version = "0.12.0"
edition = "2021"
description = "Cast-like CLI for Safe transactions"
license = "MIT"
repository = "https://github.com/tynes/safe-rs"
readme = "../README.md"
keywords = ["ethereum", "safe", "multisig", "smart-account", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "safe"
path = "src/main.rs"

[dependencies]
safe-rs = { path = "..", version = "0.12", default-features = false, features = ["simulation", "hd-wallet"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
alloy = "2.5"
alloy-dyn-abi = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
color-eyre = "0.6"
dialoguer = "0.11"
hex = "0.4"
rpassword = "7"
url = "2"
rand = "0.8"
zeroize = "1"

[features]
default = ["ledger"]
# Owner keys on a Ledger (`--ledger`). Builds libusb from source on Linux when
# the system has none.
ledger = ["safe-rs/ledger"]

[dev-dependencies]
alloy = { version = "2.5", features = ["full", "signer-local", "node-bindings"] }
tempfile = "3"

[lints]
workspace = true
