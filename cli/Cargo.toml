[package]
name = "safe-rs-cli"
version = "0.12.0"
edition = "2021"
description = "Cast-like CLI for Safe transactions"
license = "MIT"
repository = "https://github.com/tynes/safe-rs"
readme = "../README.md"
keywords = ["ethereum", "safe", "multisig", "smart-account", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "safe"
path = "src/main.rs"

[dependencies]
safe-rs = { path = "..", version = "0.12" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
alloy = { version = "2.5", features = ["full", "signer-local"] }
alloy-primitives = "1.6"
alloy-dyn-abi = "1.6"
alloy-sol-types = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
color-eyre = "0.6"
dialoguer = "0.11"
hex = "0.4"
rpassword = "7"
url = "2"

[lints]
workspace = true
