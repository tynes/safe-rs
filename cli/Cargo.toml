[package]
name = "safe-rs-cli"
version = "0.13.0"
edition = "2021"
description = "Cast-like CLI for Safe transactions"
license = "MIT"
repository = "https://github.com/tynes/safe-rs"
readme = "../README.md"
keywords = ["ethereum", "safe", "multisig", "smart-account", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "safe"
path = "src/main.rs"

[dependencies]
safe-rs = { path = "..", version = "0.13", default-features = false, features = ["simulation", "keystore"] }
clap = { version = "4", features = ["derive", "env", "string"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
alloy = "2.5"
alloy-dyn-abi = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
color-eyre = "0.6"
dialoguer = "0.11"
hex = "0.4"
rpassword = "7"
url = "2"
rand = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
zeroize = { version = "1", features = ["serde"] }

[features]
default = ["ledger"]
# One-time owner keys: `--rotate`, `--hd-wallet`, `safe rotate`, `safe wallet`
# and `safe create --hd-wallet`.
hd-wallet = ["safe-rs/hd-wallet", "dep:rand"]
# Owner keys on a Ledger (`--ledger`; implies hd-wallet). Builds libusb from
# source on Linux when the system has none.
ledger = ["hd-wallet", "safe-rs/ledger"]
# `log::TracingLogger`, for a host that already has a `tracing` subscriber.
tracing = ["dep:tracing"]

[dev-dependencies]
alloy = { version = "2.5", features = ["full", "signer-local", "node-bindings"] }
tempfile = "3"

[lints]
workspace = true

[[test]]
name = "rotate"
path = "tests/rotate.rs"
required-features = ["hd-wallet"]
