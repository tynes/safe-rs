[package]
name = "safe-rs-cli"
version = "0.13.0"
edition = "2021"
description = "Cast-like CLI for Safe transactions"
license = "MIT"
repository = "https://github.com/tynes/safe-rs"
readme = "../README.md"
keywords = ["ethereum", "safe", "multisig", "smart-account", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "safe"
path = "src/main.rs"

[dependencies]
safe-rs = { path = "..", version = "0.13", default-features = false, features = ["simulation", "keystore", "hd-wallet", "ledger"] }
clap = { version = "4", features = ["derive", "env", "string"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
alloy = "2.5"
alloy-dyn-abi = "1.6"
alloy-signer-ledger = { version = "2.5", default-features = false, features = ["eip712"] }
# The signers `cast` and `forge` use: local keys, keystores, mnemonics,
# Ledger, Trezor and (by feature) AWS KMS, GCP KMS and Turnkey. Ledger and
# Trezor are always built, against libusb (built from source on Linux when the
# system has none).
foundry-wallets = "0.1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
color-eyre = "0.6"
dialoguer = "0.11"
hex = "0.4"
rpassword = "7"
url = "2"
rand = "0.8"
tracing = { version = "0.1", optional = true }
zeroize = { version = "1", features = ["serde"] }

[features]
default = ["aws-kms", "gcp-kms", "turnkey"]
# `--aws` (and `--gas-payer-aws`): a key in AWS KMS.
aws-kms = ["foundry-wallets/aws-kms"]
# `--gcp` (and `--gas-payer-gcp`): a key in Google Cloud KMS.
gcp-kms = ["foundry-wallets/gcp-kms"]
# `--turnkey` (and `--gas-payer-turnkey`): a Turnkey key.
turnkey = ["foundry-wallets/turnkey"]
# `log::TracingLogger`, for a host that already has a `tracing` subscriber.
tracing = ["dep:tracing"]

[dev-dependencies]
alloy = { version = "2.5", features = ["full", "signer-local", "node-bindings"] }
tempfile = "3"

[lints]
workspace = true

[[test]]
name = "rotate"
path = "tests/rotate.rs"
